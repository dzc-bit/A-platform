name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHON_DOTENV_DISABLED: "1"
      DATABASE_URL: "sqlite:///./ci_backend.db"
      TOKEN_SECRET: "ci-only-secret-token"
      DEMO_PASSWORD: "ci-demo-password"
      LLM_API_KEY: ""
      EMBEDDING_API_KEY: ""
      DIFY_API_URL: ""
      DIFY_API_KEY: ""
      REDIS_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check app tests scripts migrations
      - name: Compile application
        run: python -m compileall -q app
      - name: Verify Alembic migrations round-trip
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
          rm -f ci_backend.db
      - name: Evaluate deterministic Agent and RAG metrics
        run: python scripts/evaluate_agent.py
      - name: Run backend tests when present
        if: ${{ hashFiles('backend/tests/**/*.py') != '' }}
        run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Unit tests (Vitest)
        run: pnpm test
      - name: Type-check and build
        run: pnpm run build

  containers:
    name: Compose build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose specification
        run: docker compose --env-file .env.example config -q
      - name: Build images
        run: docker compose --env-file .env.example build
      - name: Start stack and run health smoke tests
        run: |
          docker compose --env-file .env.example up -d --wait --wait-timeout 180
          curl --fail --show-error --silent http://127.0.0.1:8000/api/v1/health
          curl --fail --show-error --silent http://127.0.0.1:5173/ > /dev/null
      - name: Show container logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose --env-file .env.example down
