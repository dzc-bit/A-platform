name: neusoft-business-ai

services:
  backend:
    image: neusoft-business-ai-backend
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-sqlite:////app/data/business_ai.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      TOKEN_SECRET: ${TOKEN_SECRET:-change-this-before-production}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-28800}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-business-ai}
      DIFY_API_URL: ${DIFY_API_URL:-}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      DIFY_TTS_API_KEY: ${DIFY_TTS_API_KEY:-}
      DIFY_IMAGE_API_KEY: ${DIFY_IMAGE_API_KEY:-}
      DIFY_MEDIA_ALLOWED_HOSTS: ${DIFY_MEDIA_ALLOWED_HOSTS:-}
    ports:
      - "127.0.0.1:8000:8000"
    # Lets the container reach the separately managed Dify stack on Docker
    # Engine/Linux as well as Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - business_ai_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    depends_on:
      backend-data-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  backend-data-init:
    image: neusoft-business-ai-backend
    user: "0:0"
    command:
      - chown
      - -R
      - "10001:10001"
      - /app/data
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    volumes:
      - business_ai_data:/app/data
    restart: "no"

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:6-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - business_ai_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  business_ai_data:
  business_ai_redis:
