# Do not apply this file with the placeholder values in production.
# Create the same Secret using a secret manager or a private manifest, then apply kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: business-ai-secrets
  namespace: business-ai
type: Opaque
stringData:
  TOKEN_SECRET: replace-with-a-long-random-secret
  LLM_API_KEY: ""
  DIFY_API_URL: ""
  DIFY_API_KEY: ""
  LLM_BASE_URL: https://api.openai.com/v1
  LLM_MODEL: gpt-4o-mini
